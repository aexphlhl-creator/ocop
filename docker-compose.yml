services:
  # Database: PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: ocop-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ocop_vietnam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Caching: Redis
  redis:
    image: redis:7-alpine
    container_name: ocop-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Storage: MinIO (S3-compatible)
  minio:
    image: minio/minio
    container_name: ocop-minio
    restart: always
    entrypoint: sh
    command: -c "minio server /data --console-address ':9001'"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
