apiVersion: batch/v1
kind: CronJob
metadata:
  name: ocop-postgres-backup-hourly
  namespace: ocop-production
  labels:
    app.kubernetes.io/name: ocop-postgres-backup-hourly
    app.kubernetes.io/part-of: ocop-platform
spec:
  # Hourly snapshot backup at minute 0 of every hour to guarantee RPO <= 1 hour
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ocop-postgres-backup-hourly
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1000
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          containers:
            - name: postgres-backup-worker
              image: ghcr.io/ocop/ocop-backend:production
              workingDir: /usr/src/app
              command:
                - node
                - scripts/production-backup.mjs
              env:
                - name: NODE_ENV
                  value: "production"
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: ocop-secrets
                      key: DATABASE_URL
                - name: BACKUP_STORAGE_TYPE
                  value: "dual" # Stores to local PVC and uploads to independent S3 cold storage
                - name: BACKUP_S3_USE_LIFECYCLE_PRUNING
                  value: "true" # Delegates retention to S3 Lifecycle Policy for WORM compatibility
                - name: BACKUP_TIER
                  value: "hourly"
                - name: BACKUP_S3_PREFIX
                  value: "hourly/"
                - name: BACKUP_LOCAL_DIR
                  value: "/backups/hourly"
                - name: BACKUP_RETENTION_HOURS
                  value: "24" # 24-hour retention for hourly snapshots before pruning
                - name: BACKUP_S3_BUCKET
                  value: "ocop-prod-backups-cold-storage"
                - name: BACKUP_S3_REGION
                  value: "ap-southeast-1"
                - name: BACKUP_S3_ENDPOINT
                  valueFrom:
                    configMapKeyRef:
                      name: ocop-config
                      key: BACKUP_S3_ENDPOINT
                - name: BACKUP_S3_PORT
                  value: "443"
                - name: BACKUP_S3_USE_SSL
                  value: "true"
                - name: BACKUP_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ocop-secrets
                      key: BACKUP_S3_ACCESS_KEY
                - name: BACKUP_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ocop-secrets
                      key: BACKUP_S3_SECRET_KEY
                - name: BACKUP_HMAC_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: ocop-secrets
                      key: BACKUP_HMAC_SECRET
                - name: BACKUP_ALERT_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: ocop-secrets
                      key: BACKUP_ALERT_WEBHOOK_URL
                      optional: true
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: ocop-backup-pvc
