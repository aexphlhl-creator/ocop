name: Backend Enterprise CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: ocop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Lint & Static Security Scan
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Setup Environment Variables for Test
        run: |
          echo "NODE_ENV=test" >> $GITHUB_ENV
          echo "DATABASE_URL=postgresql://test_user:test_password@localhost:5432/ocop_test?schema=public" >> $GITHUB_ENV
          echo "JWT_SECRET=super_secret_jwt_for_test_only" >> $GITHUB_ENV
          echo "JWT_REFRESH_SECRET=super_secret_refresh_jwt" >> $GITHUB_ENV
          echo "REDIS_HOST=localhost" >> $GITHUB_ENV
          echo "REDIS_PORT=6379" >> $GITHUB_ENV
          echo "MINIO_ENDPOINT=localhost" >> $GITHUB_ENV
          echo "MINIO_ACCESS_KEY=minioadmin" >> $GITHUB_ENV
          echo "MINIO_SECRET_KEY=minioadmin" >> $GITHUB_ENV
          echo "MINIO_BUCKET=ocop-media" >> $GITHUB_ENV

      - name: Prisma Generate & Migrate
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Unit Test
        run: npm run test

      - name: Security Regression & E2E Test
        run: npm run test:e2e

      - name: Code Coverage
        run: npm run test:cov

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency Vulnerability Scan (npm audit)
        run: npm audit --audit-level=high

      - name: Build Docker Image
        run: docker build -t ocop-backend:${{ github.sha }} .

      - name: Publish Artifacts (Coverage Report)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 7
